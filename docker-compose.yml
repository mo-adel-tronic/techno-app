services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_TELEMETRY_DISABLED=1
    container_name: techno-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_NAME=u531367162_technotorial
      - DB_USER=u531367162_techno
      - DB_PASS=TechnoTorial%232020
    ports:
      - "3000:3000"
    networks:
      - techno-app-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: techno-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=u531367162_technotorial
      - MYSQL_USER=u531367162_techno
      - MYSQL_PASSWORD=TechnoTorial%232020
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - techno-app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/var/www/html
    depends_on:
      - app
    networks:
      - techno-app-network

networks:
  techno-app-network:
    driver: bridge

volumes:
  mysql_data:
  webroot: